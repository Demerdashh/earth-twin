# MOCK SPEC — hand-chosen, physically plausible values. NOT measurements.
#
# Used by pipeline/mock/generate.py to write public/data/mock/. Values were picked to sit inside
# typical published ranges for each kind of terrain and to differ enough that the weight sliders
# visibly reorder the ranking. Coordinates are approximate and unverified.
#
# Feature order in `f` arrays (contract order):
#   elevation_m, slope_deg, roughness (m), temp_range_k (K), mineral_index (0-1), ice_indicator (0-1)
# Earth candidates add a 7th value: ndvi (-1..1).

[settings]
seed = 20261114
generated_at = 2026-11-14T00:00:00Z   # fixed so the mock set is byte-for-byte reproducible
ndvi_threshold = 0.3
earth_grid_step_deg = 1.0
earth_grid_radius_km = 500
planet_grid_step_deg = 2.0
planet_grid_radius_km = 300

[settings.feature_scales]   # fixed physical scales, identical for every body
elevation_m = 1000.0
slope_deg = 5.0
roughness = 25.0
temp_range_k = 25.0
mineral_index = 0.2
ice_indicator = 0.2

[settings.default_weights]
elevation_m = 0.0           # datums differ between bodies -> off by default
slope_deg = 1.0
roughness = 1.0
temp_range_k = 1.0
mineral_index = 1.0
ice_indicator = 0.5

