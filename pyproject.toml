[project]
name = "analoglens"
version = "0.1.0"
description = "Earth analogs for Moon-base and Mars sites, explained dimension by dimension (NASA Space Apps 2026)"
readme = "README.md"
requires-python = ">=3.11"
# Core: enough for the tests, the synthetic demo and the descriptor embedder.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=9.0",
]

[project.optional-dependencies]
# Real data: read GeoTIFF and PDS DEMs (MOLA, LOLA, ETOPO) and climate layers.
real = ["rasterio>=1.3"]
# Serve pre-computed JSON to the frontend.
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
# DINOv2 embeddings. Large download; the descriptor embedder works without it.
dino = ["torch>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analoglens"]
