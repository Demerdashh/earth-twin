<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AnalogLens: places on Earth that match sites on the Moon and Mars, explained dimension by dimension. NASA Space Apps 2026."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#02040a" />
    <title>AnalogLens</title>
    <link rel="preload" href="/textures/moon_dot.webp" as="image" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23c9ccd1'/%3E%3Ccircle cx='12' cy='12' r='2.5' fill='%239aa0a8'/%3E%3Ccircle cx='19' cy='19' r='3.5' fill='%239aa0a8'/%3E%3C/svg%3E"
    />
  </head>
  <body class="is-loading" data-view="system">
    <div id="preloader" class="preloader" role="status" aria-label="Loading">
      <div class="sky" aria-hidden="true"><canvas class="stars"></canvas></div>
      <div class="pl-center">
        <p class="pl-word">Loading</p>
        <div class="pl-moons" aria-hidden="true">
          <span class="pl-moon"></span><span class="pl-moon"></span><span class="pl-moon"></span
          ><span class="pl-moon"></span><span class="pl-moon"></span>
        </div>
      </div>
    </div>

    <div id="app" inert>
      <div class="sky" aria-hidden="true"><canvas class="stars"></canvas></div>
      <main
        id="space"
        class="space"
        aria-label="Moon, Earth and Mars. Drag to look around, click a dotted area to dive in."
      ></main>

      <a class="wordmark" href="./" aria-label="AnalogLens home"
        ><span class="wordmark-mark" aria-hidden="true"></span>AnalogLens</a
      >
      <button id="status" class="status-pill" type="button"></button>

      <section id="hero" class="hero">
        <h1>An Egyptian helped choose where Apollo landed. We built the tool for the next landings.</h1>
        <p>Know what a place can teach you, and where it will mislead you.</p>
      </section>

      <p id="caption" class="caption" aria-live="polite"></p>

      <aside id="card" class="card" aria-labelledby="card-title" aria-hidden="true"></aside>

      <nav class="dock" aria-label="Navigation">
        <div class="dock-group" role="group" aria-label="Bodies">
          <button type="button" data-body="moon" aria-pressed="false">
            <i class="orb orb-moon" aria-hidden="true"></i>Moon
          </button>
          <button type="button" data-body="earth" aria-pressed="false">
            <i class="orb orb-earth" aria-hidden="true"></i>Earth
          </button>
          <button type="button" data-body="mars" aria-pressed="false">
            <i class="orb orb-mars" aria-hidden="true"></i>Mars
          </button>
        </div>
        <span class="dock-sep" aria-hidden="true"></span>
        <button
          id="to-system"
          class="dock-icon"
          type="button"
          aria-label="All three bodies"
          title="All three bodies"
          aria-pressed="true"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2" />
            <ellipse cx="12" cy="12" rx="9.5" ry="4" />
          </svg>
        </button>
        <button
          id="toggle-regions"
          class="dock-icon"
          type="button"
          aria-label="Show or hide regions"
          title="Regions"
          aria-pressed="true"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="7" cy="8" r="1.4" />
            <circle cx="12" cy="8" r="1.4" />
            <circle cx="17" cy="8" r="1.4" />
            <circle cx="9.5" cy="12.5" r="1.4" />
            <circle cx="14.5" cy="12.5" r="1.4" />
            <circle cx="12" cy="17" r="1.4" />
          </svg>
        </button>
        <button
          id="tour"
          class="dock-icon"
          type="button"
          aria-label="Play the guided tour"
          title="Tour"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.5v11l9-5.5z" /></svg>
        </button>
        <button id="about-open" class="dock-icon" type="button" aria-label="About, data and limits" title="About">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v6M12 7.6v.4" />
          </svg>
        </button>
      </nav>

      <nav id="region-nav" class="region-nav" aria-label="Jump to a region"></nav>
      <div id="tip" class="tip" hidden></div>
      <div id="about" class="about" role="dialog" aria-modal="true" aria-labelledby="about-title" hidden></div>
      <div id="fatal" class="fatal" role="alert" hidden>
        <h1>The page could not start</h1>
        <p id="fatal-msg"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
