name: CI

# Checks only. Deployment is done by Vercel (vercel.json) on every push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same local toolchain as developers: uv, Python 3.11 and the pinned pipeline deps in tools/.
      - run: npm run setup
      - run: npm run verify
      - run: npm run test:e2e
